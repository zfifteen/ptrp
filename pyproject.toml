[project]
name = "ptrp"
version = "0.5.0"
description = "PTRP standalone pipeline app"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "httpx",
  "jinja2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
